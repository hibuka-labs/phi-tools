[package]
name = "phi-tools"
version = "0.1.2"
edition = "2024"
description = "General-purpose Agent toolset — local shell and file operations"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-tools"
readme = "README.md"
keywords = ["agent", "ai", "llm", "tool", "shell"]
categories = ["development-tools", "asynchronous"]

[dependencies]
agent-base = "0.1.7"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
tracing = "0.1"

[dev-dependencies]
